# Qué filas recibe cada equipo. Prototipo (Etapa 1): solo las tareas asignadas al usuario del token.
config:
  edition: 3
streams:
  mis_tareas:
    auto_subscribe: true
    query: >
      SELECT id, document_id, assigned_user_id, status, notes, due_date, version, updated_at
      FROM document_tasks
      WHERE assigned_user_id = CAST(auth.user_id() AS integer)
