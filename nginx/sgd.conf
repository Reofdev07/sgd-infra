# nginx/sgd.conf — Reverse proxy para SGD (Frontend SPA + Laravel API + OSAI + Reverb WS)
# Usa resolver para que nginx arranque aunque los backends no estén listos aún

resolver 127.0.0.11 ipv6=off valid=10s;

# SGD-103: el protocolo real lo informa Traefik (X-Forwarded-Proto: https). El tráfico interno
# (OSAI -> http://nginx) no trae la cabecera: ahí se usa el esquema de la conexión.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# PowerSync usa streaming HTTP o WebSocket: Connection "upgrade" solo si el cliente lo pide.
map $http_upgrade $connection_upgrade_powersync {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # IP real del visitante. A este nginx no llega el visitante sino Traefik (redes privadas de Docker): la IP real
    # viene en X-Forwarded-For, y `real_ip_recursive` toma la última que NO sea de un proxy de confianza, así que lo
    # que el propio visitante escriba en ese encabezado se ignora. Sin esto, $remote_addr sería la IP de Traefik y
    # todos los visitantes compartirían los límites por IP de Laravel.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Attach legacy todavía sube por FormData; presigned cubre UploadFilesPage
    client_max_body_size 20M;

    # Frontend SPA (estáticos)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — comprime respuestas para navegar más rápido
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # --- Frontend SPA (Vue/Quasar) ---
    # El service worker NUNCA debe cachearse con immutable: si el navegador no lo
    # re-descarga, la app no se actualiza (quedaría con el __WB_MANIFEST viejo).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # robots.txt y mapa del sitio los escribe deploy-front.sh. Si no existen responden 404: sin esta regla caerían
    # en index.html y un buscador recibiría la aplicación como si fuera el archivo.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Archivos de configuración de la aplicación: un buscador puede leerlos para pintar el portal (robots.txt lo
    # permite cuando PORTAL_INDEXABLE=true), pero nunca deben aparecer como resultado de búsqueda.
    location ~ ^/(config|version)\.json$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Assets estáticos con cache largo (los nombres tienen hash, son inmutables)
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Certbot challenge (Let's Encrypt HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html
    # (necesario para Vue Router en modo history — /login, /users, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Laravel API (FastCGI a PHP-FPM) ---
    # F1: usa fastcgi_pass (no proxy_pass) porque PHP-FPM habla FastCGI, no HTTP
    # Usamos variable $backend_app para que resuelva via resolver en runtime
    location /api {
        # Las respuestas de la API son datos, no páginas: nunca se indexan (aunque robots.txt deje leer las del portal).
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_app "app:9000";
        fastcgi_pass $backend_app;
        include fastcgi_params;
        # Laravel recibe una sola IP, la real que resolvió `real_ip` arriba, y no la lista que traiga el encabezado.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
    }

    # --- Laravel Storage (archivos públicos servidos directamente) ---
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Broadcasting auth (Laravel Echo) ---
    location /broadcasting/auth {
        set $backend_app "app:9000";
        fastcgi_pass $backend_app;
        include fastcgi_params;
        # Laravel recibe una sola IP, la real que resolvió `real_ip` arriba, y no la lista que traiga el encabezado.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
    }

    # --- OSAI API (proxy reverso a FastAPI) ---
    location /osai-api/ {
        rewrite ^/osai-api/(.*) /$1 break;
        proxy_pass http://osai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- Reverb WebSocket ---
    # El frontend envía ws://HOST/ws/app/KEY — nginx quita el prefijo /ws
    # y pasa /app/KEY a reverb:8080
    location ^~ /ws/ {
        rewrite ^/ws/(.*) /$1 break;
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- PowerSync (trabajo sin conexión) ---
    # Los equipos sincronizan en /powersync/ (POWERSYNC_URL = https://DOMINIO/powersync). Conexiones largas: sin
    # buffer y con tiempo de lectura amplio. La dirección se resuelve en cada petición (resolver de arriba): si
    # PowerSync no corre, nginx arranca igual y solo esta ruta responde 502.
    location ^~ /powersync/ {
        set $powersync_upstream http://powersync:8080;
        rewrite ^/powersync/(.*) /$1 break;
        proxy_pass $powersync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_powersync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 10m;
    }

    # --- App de escritorio: instaladores y canal de actualizaciones (sgd-infra/escritorio/) ---
    # latest.json sin caché: los programas deben ver enseguida una versión nueva. Los instaladores son inmutables
    # (cada versión tiene su nombre).
    location = /escritorio/tauri/latest.json {
        alias /usr/share/nginx/escritorio/tauri/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ^~ /escritorio/ {
        alias /usr/share/nginx/escritorio/;
        default_type application/octet-stream;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Descargas (instalador de escritorio Windows) ---
    location ^~ /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
    }

    # --- Headers de seguridad (también incluidos en cada location con add_header propio) ---
    include /etc/nginx/snippets/security-headers.conf;

    # Bloquear archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
