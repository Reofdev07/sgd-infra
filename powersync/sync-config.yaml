# Qué filas recibe cada equipo (trabajo sin conexión, Etapa 2). Diseño: SDG-Back-api/docs/superpowers/specs/
# 2026-10-26-trabajo-sin-conexion-design.md §3.1; capacidades probadas: …/2026-10-27-sync-streams-capacidades.md.
#
# Las reglas de quién ve qué viven en Laravel (DocumentPolicy). Aquí solo se compara con el alcance que Laravel pone
# en el token (SyncScope): sede, deps, clasif, admin_sede, perfil. Si un filtro no se puede expresar así, se agrega
# un dato al token; la regla no se copia aquí.
#  - Columnas por lista blanca. Las revisa SDG-Back-api/tests/Feature/Sync/SyncConfigColumnsTest.php.
#  - Datos de la persona (asunto, remitente, notas…) en tablas aparte y solo de radicados cuyo nivel no los protege
#    (SensitivityLevel::MASKING).
#  - Niveles con != encadenados: PowerSync no acepta NOT IN con lista. Un nivel nulo cuenta como no protegido, igual
#    que en DocumentPolicy.
#  - Los ids van como texto (lo exige la base local).
#  - Catálogos, actividades y festivos no dependen de la sede, pero exigen un token con entidad: uno sin alcance (el
#    del super administrador, que no sincroniza) no recibe nada.
#  - Tareas: se filtran con la copia de su radicado (doc_*, triggers de la migración 2026_10_28_100000), no con
#    subconsulta: una subconsulta arma una cubeta por radicado y PowerSync admite 1.000 por usuario. En la web, los
#    radicados de «mis tareas» sí van por subconsulta, acotada a las tareas abiertas (DocumentTask::OPEN_STATUSES).
config:
  edition: 3
streams:
  # ── Escritorio: su sede, lo abierto y lo terminado hace menos de 12 meses (sync_en_ventana) ──────────────────
  escritorio_documentos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, radicado_number, radicado_at, filing_type_id, receipt_mean_id, document_class_id,
             document_nature_id, document_typology_id, document_date, folios, dependence_id, sender_dependence_id,
             responsible_user_id, branch_id, location_id, series_id, sub_series_id, process_id, current_step_id,
             current_status, sensitivity_level, classification_level, is_corruption_complaint, source, original_number,
             parent_document_id, response_deadline_at, original_deadline_at, manual_deadline, outcome_at, closed_at,
             days_elapsed_business, on_time, file_mime_type, file_size_bytes, version, created_at, updated_at
      FROM documents AS documentos
      WHERE auth.parameter('perfil') = 'escritorio' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL
        AND sync_en_ventana = true
        AND (sensitivity_level IS NULL
             OR (sensitivity_level != 'clasificado' AND sensitivity_level != 'reservado'
                 AND sensitivity_level != 'confidencial' AND sensitivity_level != 'restricted')
             OR auth.parameter('clasif') = 1 OR auth.parameter('admin_sede') = 1
             OR responsible_user_id = CAST(auth.user_id() AS integer)
             OR dependence_id IN (SELECT value FROM json_each(auth.parameter('deps'))))

  escritorio_documento_datos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, subject, sender_info, address_info, annexes_description, summary, observations,
             sender_id, recipient_id, original_file_name
      FROM documents AS documento_datos
      WHERE auth.parameter('perfil') = 'escritorio' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL
        AND sync_en_ventana = true
        AND (sensitivity_level IS NULL
             OR (sensitivity_level != 'clasificado' AND sensitivity_level != 'reservado'
                 AND sensitivity_level != 'confidencial' AND sensitivity_level != 'restricted')
             OR auth.parameter('clasif') = 1 OR auth.parameter('admin_sede') = 1
             OR responsible_user_id = CAST(auth.user_id() AS integer)
             OR dependence_id IN (SELECT value FROM json_each(auth.parameter('deps'))))
        AND (sensitivity_level IS NULL
             OR (sensitivity_level != 'restricted' AND sensitivity_level != 'reservado'
                 AND sensitivity_level != 'confidencial'))

  escritorio_tareas:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, document_id, process_activity_id, assigned_user_id, status, completed_at,
             start_date, due_date, version, created_at, updated_at
      FROM document_tasks AS tareas
      WHERE auth.parameter('perfil') = 'escritorio' AND deleted_at IS NULL AND doc_deleted = false
        AND doc_branch_id = auth.parameter('sede') AND doc_sync_en_ventana = true
        AND (doc_sensitivity_level IS NULL
             OR (doc_sensitivity_level != 'clasificado' AND doc_sensitivity_level != 'reservado'
                 AND doc_sensitivity_level != 'confidencial' AND doc_sensitivity_level != 'restricted')
             OR auth.parameter('clasif') = 1 OR auth.parameter('admin_sede') = 1
             OR doc_responsible_user_id = CAST(auth.user_id() AS integer)
             OR doc_dependence_id IN (SELECT value FROM json_each(auth.parameter('deps'))))

  escritorio_tarea_notas:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, notes
      FROM document_tasks AS tarea_notas
      WHERE auth.parameter('perfil') = 'escritorio' AND deleted_at IS NULL AND doc_deleted = false
        AND doc_branch_id = auth.parameter('sede') AND doc_sync_en_ventana = true
        AND (doc_sensitivity_level IS NULL
             OR (doc_sensitivity_level != 'clasificado' AND doc_sensitivity_level != 'reservado'
                 AND doc_sensitivity_level != 'confidencial' AND doc_sensitivity_level != 'restricted')
             OR auth.parameter('clasif') = 1 OR auth.parameter('admin_sede') = 1
             OR doc_responsible_user_id = CAST(auth.user_id() AS integer)
             OR doc_dependence_id IN (SELECT value FROM json_each(auth.parameter('deps'))))
        AND (doc_sensitivity_level IS NULL
             OR (doc_sensitivity_level != 'restricted' AND doc_sensitivity_level != 'reservado'
                 AND doc_sensitivity_level != 'confidencial'))

  escritorio_dependencias:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, name, code, acronym, status, branch_id, location_id, entity_id
      FROM dependencies AS dependencias
      WHERE auth.parameter('perfil') = 'escritorio' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL

  # ── Web: solo lo que la persona trabaja (sus tareas y lo que tiene a cargo), sin niveles protegidos ─────────────
  web_documentos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, radicado_number, radicado_at, filing_type_id, receipt_mean_id, document_class_id,
             document_nature_id, document_typology_id, document_date, folios, dependence_id, sender_dependence_id,
             responsible_user_id, branch_id, location_id, series_id, sub_series_id, process_id, current_step_id,
             current_status, sensitivity_level, classification_level, is_corruption_complaint, source, original_number,
             parent_document_id, response_deadline_at, original_deadline_at, manual_deadline, outcome_at, closed_at,
             days_elapsed_business, on_time, file_mime_type, file_size_bytes, version, created_at, updated_at
      FROM documents AS documentos
      WHERE auth.parameter('perfil') = 'web' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL
        AND sync_en_ventana = true
        AND (sensitivity_level IS NULL
             OR (sensitivity_level != 'clasificado' AND sensitivity_level != 'reservado'
                 AND sensitivity_level != 'confidencial' AND sensitivity_level != 'restricted'))
        AND (responsible_user_id = CAST(auth.user_id() AS integer)
             OR id IN (SELECT document_id FROM document_tasks
                       WHERE assigned_user_id = CAST(auth.user_id() AS integer) AND deleted_at IS NULL
                         AND (status = 'pending' OR status = 'in_progress' OR status = 'blocked')))

  web_documento_datos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, subject, sender_info, address_info, annexes_description, summary, observations,
             sender_id, recipient_id, original_file_name
      FROM documents AS documento_datos
      WHERE auth.parameter('perfil') = 'web' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL
        AND sync_en_ventana = true
        AND (sensitivity_level IS NULL
             OR (sensitivity_level != 'clasificado' AND sensitivity_level != 'reservado'
                 AND sensitivity_level != 'confidencial' AND sensitivity_level != 'restricted'))
        AND (responsible_user_id = CAST(auth.user_id() AS integer)
             OR id IN (SELECT document_id FROM document_tasks
                       WHERE assigned_user_id = CAST(auth.user_id() AS integer) AND deleted_at IS NULL
                         AND (status = 'pending' OR status = 'in_progress' OR status = 'blocked')))

  web_tareas:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, document_id, process_activity_id, assigned_user_id, status, completed_at,
             start_date, due_date, version, created_at, updated_at
      FROM document_tasks AS tareas
      WHERE auth.parameter('perfil') = 'web' AND assigned_user_id = CAST(auth.user_id() AS integer)
        AND deleted_at IS NULL AND doc_deleted = false AND doc_branch_id = auth.parameter('sede')
        AND doc_sync_en_ventana = true
        AND (doc_sensitivity_level IS NULL
             OR (doc_sensitivity_level != 'clasificado' AND doc_sensitivity_level != 'reservado'
                 AND doc_sensitivity_level != 'confidencial' AND doc_sensitivity_level != 'restricted'))

  web_tarea_notas:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, notes
      FROM document_tasks AS tarea_notas
      WHERE auth.parameter('perfil') = 'web' AND assigned_user_id = CAST(auth.user_id() AS integer)
        AND deleted_at IS NULL AND doc_deleted = false AND doc_branch_id = auth.parameter('sede')
        AND doc_sync_en_ventana = true
        AND (doc_sensitivity_level IS NULL
             OR (doc_sensitivity_level != 'clasificado' AND doc_sensitivity_level != 'reservado'
                 AND doc_sensitivity_level != 'confidencial' AND doc_sensitivity_level != 'restricted'))

  web_dependencias:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, name, code, acronym, status, branch_id, location_id, entity_id
      FROM dependencies AS dependencias
      WHERE auth.parameter('perfil') = 'web' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL

  # ── Etapa 3: historial, actuaciones y expedientes (copia doc_* del radicado, sin subconsulta) ──────────────────
  escritorio_trazas:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, document_id, user_id, event_type, destination_dependence_id, assigned_user_id,
