; php/www.conf — Pool PHP-FPM parametrizado para el servicio 'app' (Laravel)
; Reemplaza el pool por defecto de la imagen oficial php:8.2-fpm, que solo trae
; pm.max_children=5 (demasiado bajo para picos de carga).
;
; Los valores se inyectan desde docker-compose via variables de entorno
; (PHP_FPM_*), por lo que NO hay numeros magicos aqui: se ajustan solo desde
; sgd-infra/.env (ver docs/ESCALABILIDAD-Y-RENDIMIENTO.md).
; Es necesario que el pool tenga 'clear_env = no' para que php-fpm expanda las
; variables ${PHP_FPM_*} desde el entorno del contenedor.

[www]
user = www-data
group = www-data

; FPM escucha en TCP en todas las interfaces para que nginx (fastcgi_pass app:9000)
; pueda alcanzarlo. El zz-docker.conf de la imagen oficial tambien lo fija a 9000.
listen = 9000

; Pool dinamico: el numero de workers crece y decrece segun la demanda.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}

; Recicla cada worker tras 500 requests para evitar fugas de memoria a largo plazo.
pm.max_requests = 500

; Timeout duro por request (los jobs de IA/upload van por la cola, no por FPM).
request_terminate_timeout = 120

; Permite que los workers hereden las variables de entorno (necesario para la
; expansion de PHP_FPM_* y para que Laravel lea sus ENV).
clear_env = no