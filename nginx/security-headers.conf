# Cabeceras de seguridad (SGD-102). nginx NO hereda add_header del server en un location que
# declara su propio add_header: este archivo se incluye en el server y en cada location con add_header.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# TLS lo termina Traefik; sin includeSubDomains para no afectar otros subdominios de aviliontech.com.
add_header Strict-Transport-Security "max-age=31536000" always;

# SGD-042: CSP estricta en modo SOLO REPORTE (no bloquea). La meta CSP de index.html sigue aplicando.
# Revisar los reportes (log "CSP violación") y, cuando no haya violaciones legítimas, pasarla a
# Content-Security-Policy y quitar la meta. El hash es el script inline de config.json en index.html.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-+Cn8/vwqNHVWy3n2i31MaZvK5XPRE2fpSXnP3+OSCP4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https://*.backblazeb2.com; frame-src 'self' blob: https://view.officeapps.live.com https://*.backblazeb2.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;
