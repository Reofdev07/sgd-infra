# docker-compose.override.yml — Override para desarrollo local
# Postgres local (servicio postgres) + imágenes pre-compiladas
#
# USO LOCAL:
#   docker compose up -d postgres redis app worker-default worker-pqrsd scheduler reverb osai nginx
#
# Para producción en el VPS: renombra este archivo:
#   mv docker-compose.override.yml docker-compose.override.yml.bak

services:
  # Postgres de desarrollo. Bases: sgd y sgd_test.
  # Levantar solo este servicio: docker compose up -d postgres  (en WSL: docker.exe compose …)
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgd
      POSTGRES_USER: sgd
      POSTGRES_PASSWORD: sgd
    # Replicación lógica para el servicio de sincronización (PowerSync); el tope evita que un slot detenido llene el disco.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    ports:
      - "5433:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    configs:
      - source: pg_init_local
        target: /docker-entrypoint-initdb.d/01-bases-locales.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgd -d sgd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de sincronización (trabajo sin conexión). Preparar la base antes: bash powersync/preparar-local.sh
  powersync:
    image: journeyapps/powersync-service:1.27.2
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://powersync_rep:powersync_rep_local@postgres:5432/sgd
      PS_STORAGE_SOURCE_URI: postgresql://powersync_storage:powersync_storage_local@postgres:5432/powersync_storage
      # En local Laravel corre en el equipo con `php artisan serve` (puerto 8000).
      PS_JWKS_URL: http://host.docker.internal:8000/api/sync/jwks
      PS_PORT: "8080"
      PS_ADMIN_TOKEN: solo-local-desarrollo
    volumes:
      - ./powersync:/config:ro
    networks:
      - sgd-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8089:8080"

  app:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sgd
      - DB_USERNAME=sgd
      - DB_PASSWORD=sgd
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-default:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sgd
      - DB_USERNAME=sgd
      - DB_PASSWORD=sgd
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-pqrsd:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sgd
      - DB_USERNAME=sgd
      - DB_PASSWORD=sgd
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sgd
      - DB_USERNAME=sgd
      - DB_PASSWORD=sgd
    extra_hosts:
      - "host.docker.internal:host-gateway"

  reverb:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sgd
      - DB_USERNAME=sgd
      - DB_PASSWORD=sgd
    extra_hosts:
      - "host.docker.internal:host-gateway"

  osai:
    image: sgd-osai:latest
    build: !reset null
volumes:
  pg_data_local:

configs:
  # Solo desarrollo local: base de pruebas aparte y extensiones en ambas bases.
  pg_init_local:
    content: |
      CREATE DATABASE sgd_test OWNER sgd;
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS unaccent;
      \connect sgd_test
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS unaccent;
