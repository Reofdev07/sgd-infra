      SELECT CAST(id AS text) AS id, date, name, entity_id, branch_id
      FROM holidays AS festivos
      WHERE auth.parameter('perfil') = 'escritorio' AND auth.parameter('entidad') IS NOT NULL AND (entity_id = auth.parameter('entidad') OR entity_id IS NULL)

  web_funcionarios:
