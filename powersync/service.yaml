# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@1.27.2/json-schema/powersync-config.json
# Configuración del servicio de sincronización. Solo se sustituyen variables que empiezan con PS_ (!env).
telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

# Estado de PowerSync en otra base del mismo Postgres (sin MongoDB).
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

# Tokens emitidos por Laravel (GET /api/v1/sync/token), llaves en GET /api/sync/jwks.
client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["sgd-sync"]

api:
  tokens:
    - !env PS_ADMIN_TOKEN
