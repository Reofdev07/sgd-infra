      WHERE auth.parameter('perfil') = 'web' AND auth.parameter('entidad') IS NOT NULL AND deleted_at IS NULL

  web_pasos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, process_id, name, "order" AS orden
      FROM process_steps AS pasos
      WHERE auth.parameter('perfil') = 'web' AND auth.parameter('entidad') IS NOT NULL AND deleted_at IS NULL

  web_festivos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, date, name, entity_id, branch_id
      FROM holidays AS festivos
      WHERE auth.parameter('perfil') = 'web' AND auth.parameter('entidad') IS NOT NULL AND (entity_id = auth.parameter('entidad') OR entity_id IS NULL)
