# docker-compose.override.yml — Override para desarrollo local
# Reusa el Oracle XE existente del host + imágenes pre-compiladas
#
# USO LOCAL:
#   docker compose up -d redis app worker-default worker-pqrsd scheduler reverb osai nginx
#
# Para producción en el VPS: renombra este archivo:
#   mv docker-compose.override.yml docker-compose.override.yml.bak

services:
  oracle-xe:
    restart: "no"

  # Postgres de desarrollo (migración Oracle → Postgres). Bases: sgd y sgd_test.
  # Levantar solo este servicio: docker compose up -d postgres  (en WSL: docker.exe compose …)
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgd
      POSTGRES_USER: sgd
      POSTGRES_PASSWORD: sgd
    ports:
      - "5433:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    configs:
      - source: pg_init_local
        target: /docker-entrypoint-initdb.d/01-bases-locales.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgd -d sgd"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=1522
      - DB_USERNAME=SGD_MR7
      - DB_PASSWORD=sgd123
      - DB_SERVICE_NAME=FREEPDB1
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-default:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=1522
      - DB_USERNAME=SGD_MR7
      - DB_PASSWORD=sgd123
      - DB_SERVICE_NAME=FREEPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-pqrsd:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=1522
      - DB_USERNAME=SGD_MR7
      - DB_PASSWORD=sgd123
      - DB_SERVICE_NAME=FREEPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=1522
      - DB_USERNAME=SGD_MR7
      - DB_PASSWORD=sgd123
      - DB_SERVICE_NAME=FREEPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  reverb:
    image: sgd-php:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=1522
      - DB_USERNAME=SGD_MR7
      - DB_PASSWORD=sgd123
      - DB_SERVICE_NAME=FREEPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  osai:
    image: sgd-osai:latest
    build: !reset null
volumes:
  pg_data_local:

configs:
  # Solo desarrollo local: base de pruebas aparte y extensiones en ambas bases.
  pg_init_local:
    content: |
      CREATE DATABASE sgd_test OWNER sgd;
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS unaccent;
      \connect sgd_test
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS unaccent;
