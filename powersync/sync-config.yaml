      WHERE auth.parameter('perfil') = 'web' AND branch_id = auth.parameter('sede') AND deleted_at IS NULL

  web_tipologias:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, name, code, response_days, day_type, is_pqrsd, series_id, sub_series_id,
             status, entity_id
      FROM document_typologies AS tipologias
      WHERE auth.parameter('perfil') = 'web' AND entity_id = auth.parameter('entidad')

  web_catalogos:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, class_table_id, name, acronym, type, class_acronym
      FROM gdo_tablas AS catalogos
      WHERE auth.parameter('perfil') = 'web' AND auth.parameter('entidad') IS NOT NULL AND deleted_at IS NULL

  web_actividades:
    auto_subscribe: true
    query: >
      SELECT CAST(id AS text) AS id, process_step_id, name, "order" AS orden, status, depends_on_activity_id
